# 设置工作进程数，一般用 CPU 核心数即可
worker_processes 2;

# 事件模块设置，每个 worker 最大连接数
events { 
    worker_connections 1024;  # 单个 worker 最多能处理 1024 个并发连接
}

http {
    # 载入 MIME 类型映射（用于浏览器识别文件类型）
    include       mime.types;
    default_type  application/octet-stream;  # 默认文件类型

    sendfile        on;          # 开启高效文件传输
    keepalive_timeout  65;       # 长连接超时时间

    server {
        listen 8001;
        server_name web-project;
        root /workspace;  # 设置网站根目录

        # 访问 http://localhost:8001/ 时列出根目录下所有文件
        # location = / {
        #     autoindex on;
        #     autoindex_exact_size off;
        #     autoindex_localtime on;
        # }

        # \.(css|js|png|jpg|jpeg|gif|ico|svg)$
        ## 这是一个正则表达式：
        ## \. → 匹配 点号（. 在正则里是特殊字符，前面加 \ 表示字面上的点）
        ## (css|js|png|jpg|jpeg|gif|ico|svg) → 括号表示分组，竖线 | 表示“或者”
        ## 意思是：匹配 css 或 js 或 png 或 jpg 或 jpeg 或 gif 或 ico 或 svg
        ## $ → 匹配 字符串末尾
        ## 意思是文件名以这些后缀结尾才匹配
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|html)$ {
            expires 1y; # 设置缓存过期时间为 1 年
            add_header Cache-Control "public, immutable"; # 设置缓存控制头，表示资源是公共的且不可变(不适用于动态内容,如html会显示一些可变的数据库的内容,所以不适合)
        }

        # 尝试访问文件，如果存在则返回，不存在则重定向到 aldebaran/page.html
        location / {
            try_files $uri $uri/ /aldebaran/page.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

    }
}
