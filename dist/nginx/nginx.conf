# 设置工作进程数，一般用 CPU 核心数即可
worker_processes 2;

# 事件模块设置，每个 worker 最大连接数
events { 
    worker_connections 1024;  # 单个 worker 最多能处理 1024 个并发连接
}

http {
    # 载入 MIME 类型映射（用于浏览器识别文件类型）
    include       mime.types;
    # 默认文件类型
    default_type  application/octet-stream;  

    # 开启高效文件传输
    sendfile        on;         

    # 长连接超时时间
    keepalive_timeout  65;       

    server {
        # 监听8001端口
        listen 8001;
        # 设置服务器名称
        server_name web-project;
        # 设置网站根目录
        root /workspace;  

        # 设置默认首页文件.当访问目录时，nginx 会尝试返回当前目录的 index.html 文件
        # 如果找不到index.html，则返回 403 错误(注意不是404)
        index index.html;  

        # "location /":匹配所有以 / 开头的路径
        location / {
            try_files $uri $uri/ /aldebaran/page.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        # 将404错误重定向到 /aldebaran/page.html 页面
        error_page 404 =302 /aldebaran/page.html;
        # 将403错误重定向到 /aldebaran/page.html 页面
        error_page 403 =302 /aldebaran/page.html;

    }
}
